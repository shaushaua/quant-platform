version: '3.8'

services:
  # 数据采集服务 (独立运行)
  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    container_name: qlib-collector
    volumes:
      - ./data:/data
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_HOST=${ALIYUN_REDIS_HOST:-}
      - REDIS_PORT=${ALIYUN_REDIS_PORT:-6379}
      - TONGLIANG_TOKEN=${TONGLIANG_TOKEN:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - TONGLIANG_QUOTE_TTL=1
      - TONGLIANG_KLINE_TTL=60
      - TONGLIANG_TICK_FLUSH_INTERVAL=10
    networks:
      - qlib-network
    restart: unless-stopped

networks:
  qlib-network:
    driver: bridge
