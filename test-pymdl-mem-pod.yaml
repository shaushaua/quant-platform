apiVersion: v1
kind: Pod
metadata:
  name: test-pymdl-mem
  namespace: quant
spec:
  nodeSelector:
    role: live-trading
  tolerations:
    - effect: NoSchedule
      key: role
      operator: Equal
      value: live-trading
    - effect: NoSchedule
      key: node.kubernetes.io/disk-pressure
      operator: Exists
  hostNetwork: true
  restartPolicy: Never
  containers:
    - name: test
      image: 172.24.99.176:5000/quant-platform/sdk-collector:latest
      command: ["python", "/scripts/test_pymdl_mem.py"]
      env:
        - name: TZ
          value: Asia/Shanghai
        - name: MDL_SERVER
          value: "127.0.0.1:9012"
      volumeMounts:
        - name: mdl-logs
          mountPath: /data/quant/mdl_logs
        - name: script
          mountPath: /scripts
  volumes:
    - name: mdl-logs
      hostPath:
        path: /data/quant/mdl_logs
        type: DirectoryOrCreate
    - name: script
      configMap:
        name: test-pymdl-mem-script
