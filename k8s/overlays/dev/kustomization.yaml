# Dev overlay: small machines, reduced resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: combined-engine
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: combined-engine
        namespace: quant
      spec:
        template:
          spec:
            containers:
              - name: combined-engine
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    cpu: "4"
                    memory: 6Gi
