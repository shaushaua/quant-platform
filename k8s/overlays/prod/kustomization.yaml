# Prod overlay: 44-core 196GB node
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: combined-engine
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: combined-engine
        namespace: quant
      spec:
        template:
          spec:
            containers:
              - name: combined-engine
                env:
                  - name: USE_PERSISTENT_POOL
                    value: "true"
                  - name: FACTOR_WORKERS
                    value: "44"
                  # --- 实盘路由（base 默认是模拟盘，prod 必须覆盖）---
                  # 不覆盖的话 kubectl apply -k overlays/prod 会把实盘打成模拟盘。
                  - name: ORDER_GATEWAY_URL
                    value: "http://172.24.99.176:8080"
                  - name: BROKER_ACCOUNT_ID
                    value: "501000119118"
                  # --- ST/退市过滤：Pod 启动时调 trading_universe() 排除 ST ---
                  - name: TRADING_UNIVERSE_MODULE
                    value: "quant_platform.inference.trading_universe"
                  # --- 订单算法 50/50 分流：偶数 VWAP / 奇数 TWAP ---
                  - name: ORDER_ALGO_SPLIT_VWAP_TWAP
                    value: "1"
                resources:
                  requests:
                    cpu: "2"
                    memory: 32Gi
                  limits:
                    cpu: "44"
                    memory: 160Gi
