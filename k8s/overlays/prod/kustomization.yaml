# Prod overlay: 48-core ~90GB node
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: combined-engine
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: combined-engine
        namespace: quant
      spec:
        template:
          spec:
            containers:
              - name: combined-engine
                env:
                  - name: USE_PERSISTENT_POOL
                    value: "true"
                resources:
                  requests:
                    cpu: "4"
                    memory: 4Gi
                  limits:
                    cpu: "41"
                    memory: 80Gi
