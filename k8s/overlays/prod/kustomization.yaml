# Prod overlay: 48-core 96GB node
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: combined-engine
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: combined-engine
        namespace: quant
      spec:
        template:
          spec:
            containers:
              - name: combined-engine
                env:
                  - name: USE_PERSISTENT_POOL
                    value: "true"
                  - name: FACTOR_WORKERS
                    value: "44"
                resources:
                  requests:
                    cpu: "2"
                    memory: 32Gi
                  limits:
                    cpu: "46"
                    memory: 160Gi
