# 验证通联 CSV 文件写入模式：是否纯追加写入
# 用法：kubectl apply -f k8s/base/verify-csv-write-pattern.yaml
# 查看结果：cat /data/quant/verify_csv_write_pattern.txt
# 清理：kubectl delete job verify-csv-write-pattern -n quant
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-csv-write-pattern
  namespace: quant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: verify
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== 通联 CSV 写入模式验证 ==="
              YESTERDAY=$(python3 -c "from datetime import datetime, timedelta; print((datetime.now()-timedelta(days=1)).strftime('%Y%m%d'))")
              echo "检查日期: $YESTERDAY"

              # 1. 文件基本属性
              echo ""
              echo "=== 文件属性 ==="
              for f in mdl_6_36_0.csv mdl_4_24_0.csv; do
                FP="/www/wwwroot/mdl/msg_backup/$YESTERDAY/$f"
                if [ -f "$FP" ]; then
                  echo "$f:"
                  stat "$FP" | grep -E "Size|Inode|Modify|Change"
                  echo "  行数: $(wc -l < $FP)"
                  echo ""
                fi
              done

              # 2. 首行和尾行时间戳
              echo "=== 首尾行时间戳 ==="
              for f in mdl_6_36_0.csv mdl_4_24_0.csv; do
                FP="/www/wwwroot/mdl/msg_backup/$YESTERDAY/$f"
                if [ -f "$FP" ]; then
                  echo "$f:"
                  echo "  首行(第2行): $(sed -n '2p' $FP | cut -d, -f11)"
                  echo "  尾行: $(tail -1 $FP | cut -d, -f11)"
                  echo ""
                fi
              done

              # 3. 等距采样时间戳（用 dd，避免读整个文件）
              echo "=== 时间戳采样（mdl_6_36_0.csv TransactTime=col11）==="
              FP="/www/wwwroot/mdl/msg_backup/$YESTERDAY/mdl_6_36_0.csv"
              if [ -f "$FP" ]; then
                FSIZE=$(stat -c%s "$FP")
                echo "文件大小: $FSIZE bytes ($(( FSIZE / 1024 / 1024 / 1024 ))GB)"
                echo ""
                for i in $(seq 0 4); do
                  OFF=$(( FSIZE * i / 5 ))
                  # 读 512 字节，取第一个完整行
                  LINE=$(dd if="$FP" bs=1 skip=$OFF count=512 2>/dev/null | head -2 | tail -1)
                  TS=$(echo "$LINE" | cut -d, -f11)
                  SID=$(echo "$LINE" | cut -d, -f6)
                  echo "  offset=$OFF -> ts=$TS sid=$SID"
                done
              fi

              # 4. collector offset 失效模拟
              echo ""
              echo "=== Collector offset 风险评估 ==="
              echo "FilePoller 逻辑: current_size <= offset -> return None"
              echo "如果通联客户端截断重写，文件变小，collector 永远读不到新数据"
              echo ""
              echo "上面的采样结果如果时间戳单调递增，说明是纯追加写"
              echo "如果出现逆序，说明有重写行为"

              echo ""
              echo "=== 完成 ==="
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: msg-backup
              mountPath: /www/wwwroot/mdl/msg_backup
            - name: output
              mountPath: /data/quant
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 512Mi
      volumes:
        - name: msg-backup
          hostPath:
            path: /www/wwwroot/mdl/msg_backup
            type: DirectoryOrCreate
        - name: output
          hostPath:
            path: /data/quant
            type: DirectoryOrCreate
