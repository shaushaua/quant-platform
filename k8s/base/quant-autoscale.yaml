# quant-autoscale: 交易日自动扩缩容
# 依赖: trade-calendar ConfigMap (由 scripts/gen_trade_calendar.py 生成)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quant-autoscale
  namespace: quant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quant-autoscale
  namespace: quant
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["trade-calendar"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quant-autoscale
  namespace: quant
subjects:
  - kind: ServiceAccount
    name: quant-autoscale
roleRef:
  kind: Role
  name: quant-autoscale
  apiGroup: rbac.authorization.k8s.io
---
# 每个交易日 08:50 扩容
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quant-scale-up
  namespace: quant
spec:
  schedule: "50 8 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: quant-autoscale
          restartPolicy: Never
          containers:
            - name: scale-up
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  TODAY=$(date +%Y%m%d)

                  # Check trading calendar
                  CALENDAR=$(kubectl get configmap trade-calendar -n quant -o jsonpath='{.data.trading_days}')
                  if echo ",${CALENDAR}," | grep -q ",${TODAY},"; then
                    echo "[$(date)] $TODAY is a trading day, scaling up..."
                    kubectl patch deployment combined-engine -n quant -p '{"spec":{"replicas":1}}'
                    echo "[$(date)] Done. Deployment scaled to 1."
                  else
                    echo "[$(date)] $TODAY is NOT a trading day, skipping."
                  fi
---
# 每个交易日 15:30 缩容（幂等，非交易日也安全）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quant-scale-down
  namespace: quant
spec:
  schedule: "30 15 * * 1-5"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: quant-autoscale
          restartPolicy: Never
          containers:
            - name: scale-down
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  echo "[$(date)] Scaling down combined-engine..."
                  kubectl patch deployment combined-engine -n quant -p '{"spec":{"replicas":0}}'
                  echo "[$(date)] Done. Deployment scaled to 0."
