# collector：持续运行，监听通联 CSV 文件，写入 /dev/shm/store（hostPath）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: quant
  labels:
    app: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      # 固定调度到绑定通联 License 的节点
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: collector
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command: ["python", "-m", "quant_platform.collector.collector"]
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MSG_BACKUP_DIR
              value: /root/mdl/msg_backup
            - name: SHM_STORE_PATH
              value: /dev/shm/quant-store
            - name: COLLECTOR_SKIP_HISTORY
              value: "true"
            - name: COLLECTOR_DEBOUNCE_MS
              value: "100"
            - name: LOG_LEVEL
              value: INFO
            # 每只股票 order/deal 最多保留多少行（防止 90GB 数据撑爆内存）
            - name: SHM_MAX_ROWS_PER_SYMBOL
              value: "10000"
            # daily_basic 从 MySQL 加载的历史天数
            - name: DAILY_BASIC_MARKET_COUNT
              value: "5"
            # 处理完成后保留源文件天数（防止磁盘打满）
            - name: DELETE_SOURCE_AFTER_DAYS
              value: "1"
            - name: OSS_DATA_BUCKET
              value: "quant-mdl-data"
            - name: COLLECTOR_DISK_OUTPUT
              value: /data/collector_output
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: mdl-data
              mountPath: /root/mdl/msg_backup
            - name: shm-store
              mountPath: /dev/shm/quant-store
            - name: disk-output
              mountPath: /data/collector_output
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
      volumes:
        - name: mdl-data
          hostPath:
            path: /www/wwwroot/mdl/msg_backup
            type: DirectoryOrCreate
        # hostPath 替代 emptyDir：允许 collector 和 live-engine CronJob
        # 作为独立 Pod 运行，同时共享宿主机 /dev/shm 内的同一目录
        - name: shm-store
          hostPath:
            path: /dev/shm/quant-store
            type: DirectoryOrCreate
        - name: disk-output
          hostPath:
            path: /data/quant/collector_output
            type: DirectoryOrCreate
