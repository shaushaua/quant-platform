# collector：通过 pymdl 订阅本机通联客户端 9012，写入 /dev/shm/store（hostPath）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: quant
  labels:
    app: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      # 固定调度到绑定通联 License 的节点
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: collector
          image: 172.24.99.176:5000/quant-platform/sdk-collector:latest
          command: ["python", "-m", "quant_platform.collector.sdk_collector"]
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MDL_SERVER
              value: 127.0.0.1:9012
            - name: MDL_IO_THREADS
              value: "4"
            - name: MDL_CALLBACK_MULTITHREAD
              value: "false"
            - name: MDL_ENCODING
              value: "1"
            - name: MDL_ENABLE_MERGE
              value: "false"
            - name: MDL_SUBS
              value: "4.4,4.24,6.28,6.33,6.36"
            - name: MDL_FLUSH_INTERVAL_MS
              value: "10"
            - name: MDL_BATCH_SIZE
              value: "2000"
            - name: MDL_QUEUE_WARN_SIZE
              value: "50000"
            - name: MDL_QUEUE_HARD_LIMIT
              value: "200000"
            - name: SHM_STORE_PATH
              value: /dev/shm/quant-store
            - name: LOG_LEVEL
              value: INFO
            - name: PIPELINE_LOG_DIR
              value: /data/quant/pipeline_logs
            - name: PIPELINE_LOG_FALLBACK_DIR
              value: /tmp/quant_pipeline_logs
            # daily_basic 从 MySQL 加载的历史天数
            - name: DAILY_BASIC_MARKET_COUNT
              value: "5"
            # 兜底清理窗口（秒），live-engine 正常消费时不会触发
            - name: ROLLING_WINDOW_SECONDS
              value: "1800"
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: shm-store
              mountPath: /dev/shm/quant-store
            - name: pipeline-logs
              mountPath: /data/quant/pipeline_logs
            - name: mdl-logs
              mountPath: /data/quant/mdl_logs
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        # hostPath 替代 emptyDir：允许 collector 和 live-engine CronJob
        # 作为独立 Pod 运行，同时共享宿主机 /dev/shm 内的同一目录
        - name: shm-store
          hostPath:
            path: /dev/shm/quant-store
            type: DirectoryOrCreate
        - name: pipeline-logs
          hostPath:
            path: /data/quant/pipeline_logs
            type: DirectoryOrCreate
        - name: mdl-logs
          hostPath:
            path: /data/quant/mdl_logs
            type: DirectoryOrCreate
