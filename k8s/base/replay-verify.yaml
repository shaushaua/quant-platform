# 一次性 Job：回放因子计算并对比实盘结果
# 用法：kubectl apply -f k8s/base/replay-verify.yaml
# 查看结果：cat /data/quant/replay_verify.txt
# 清理：kubectl delete job replay-verify -n quant
---
apiVersion: batch/v1
kind: Job
metadata:
  name: replay-verify
  namespace: quant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: replay
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== 开始全市场回放对比（仅09:30后）==="
              YESTERDAY=$(python3 -c "from datetime import datetime, timedelta; print((datetime.now()-timedelta(days=1)).strftime('%Y%m%d'))")
              python3 -m quant_platform.scripts.replay_factors \
                --date $YESTERDAY \
                --minutes 5 \
                --nrows 3000000 \
                2>&1 | tee /data/quant/replay_verify.txt
              echo "=== 完成 ==="
          env:
            - name: TZ
              value: Asia/Shanghai
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: msg-backup
              mountPath: /www/wwwroot/mdl/msg_backup
            - name: output
              mountPath: /data/quant
          resources:
            limits:
              memory: 8Gi
            requests:
              memory: 4Gi
      volumes:
        - name: msg-backup
          hostPath:
            path: /www/wwwroot/mdl/msg_backup
            type: DirectoryOrCreate
        - name: output
          hostPath:
            path: /data/quant
            type: DirectoryOrCreate
