# 一次性 Job：回放因子计算并对比实盘结果
# 用法：kubectl apply -f k8s/base/replay-verify.yaml
# 查看结果：cat /data/quant/replay_verify.txt
# 清理：kubectl delete job replay-verify -n quant
---
apiVersion: batch/v1
kind: Job
metadata:
  name: replay-verify
  namespace: quant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: replay
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== 开始回放对比 ==="
              python3 scripts/replay_factors.py \
                --date $(date +%Y%m%d) \
                --stocks 10 \
                --timepoints 24 \
                2>&1 | tee /data/quant/replay_verify.txt
              echo "=== 完成 ==="
          env:
            - name: TZ
              value: Asia/Shanghai
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: msg-backup
              mountPath: /www/wwwroot/mdl/msg_backup
            - name: output
              mountPath: /data/quant
      volumes:
        - name: msg-backup
          hostPath:
            path: /www/wwwroot/mdl/msg_backup
            type: DirectoryOrCreate
        - name: output
          hostPath:
            path: /data/quant
            type: DirectoryOrCreate
