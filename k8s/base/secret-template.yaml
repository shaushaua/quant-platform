# quant-secrets Secret 模板
# 实际部署时用 kubectl create secret 或 KMS 方式创建，不提交明文值。
#
# 创建命令示例：
#   kubectl create secret generic quant-secrets \
#     --namespace=quant \
#     --from-literal=TONGLIAN_USERNAME=<用户名> \
#     --from-literal=TONGLIAN_PASSWORD=<密码> \
#     --from-literal=MDL_TOKEN=<通联MDL 32位Token> \
#     --from-literal=OSS_ACCESS_KEY_ID=<ak> \
#     --from-literal=OSS_ACCESS_KEY_SECRET=<sk> \
#     --from-literal=OSS_DATA_BUCKET=<行情数据bucket> \
#     --from-literal=OSS_RESULT_BUCKET=<因子结果bucket> \
#     --from-literal=OSS_ENDPOINT=oss-cn-shanghai-internal.aliyuncs.com \
#     --from-literal=MYSQL_HOST=<host> \
#     --from-literal=MYSQL_PORT=3306 \
#     --from-literal=MYSQL_USER=<user> \
#     --from-literal=MYSQL_PASSWORD=<password> \
#     --from-literal=MYSQL_DATABASE=quant \
#     --from-literal=QMT_GATEWAY_TOKEN=<qmt-gateway-token>
apiVersion: v1
kind: Secret
metadata:
  name: quant-secrets
  namespace: quant
type: Opaque
stringData:
  TONGLIAN_USERNAME: "<REPLACE>"
  TONGLIAN_PASSWORD: "<REPLACE>"
  MDL_TOKEN: "<REPLACE>"
  OSS_ACCESS_KEY_ID: "<REPLACE>"
  OSS_ACCESS_KEY_SECRET: "<REPLACE>"
  OSS_DATA_BUCKET: "<REPLACE>"
  OSS_RESULT_BUCKET: "<REPLACE>"
  OSS_ENDPOINT: "oss-cn-shanghai-internal.aliyuncs.com"
  MYSQL_HOST: "<REPLACE>"
  MYSQL_PORT: "3306"
  MYSQL_USER: "<REPLACE>"
  MYSQL_PASSWORD: "<REPLACE>"
  MYSQL_DATABASE: "quant"
  QMT_GATEWAY_TOKEN: "<REPLACE>"
