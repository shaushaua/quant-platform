# 一次性 Job：实盘因子数据完整性验证
# 用法：kubectl apply -f k8s/base/verify-live-factors.yaml
# 查看结果：cat /data/quant/verify_live_factors.txt
# 清理：kubectl delete job verify-live-factors -n quant
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-live-factors
  namespace: quant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: verify
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "=== 实盘因子数据完整性验证 ==="
              YESTERDAY=$(python3 -c "from datetime import datetime, timedelta; print((datetime.now()-timedelta(days=1)).strftime('%Y%m%d'))")
              python3 -m quant_platform.scripts.verify_live_factors \
                --date $YESTERDAY \
                2>&1 | tee /data/quant/verify_live_factors.txt
              echo "=== 完成 ==="
          env:
            - name: TZ
              value: Asia/Shanghai
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: output
              mountPath: /data/quant
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 2Gi
      volumes:
        - name: output
          hostPath:
            path: /data/quant
            type: DirectoryOrCreate
