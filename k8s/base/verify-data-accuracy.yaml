# 验证实盘因子数据准确性：对比 daily_basic 日线数据
# 用法：kubectl apply -f k8s/base/verify-data-accuracy.yaml
# 结果：cat /data/quant/verify_data_accuracy.txt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-data-accuracy
  namespace: quant
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      restartPolicy: Never
      containers:
        - name: verify
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - |
              YESTERDAY=$(python3 -c "from datetime import datetime, timedelta; print((datetime.now()-timedelta(days=1)).strftime('%Y%m%d'))")
              python3 -m quant_platform.scripts.verify_data_accuracy \
                --date $YESTERDAY \
                2>&1 | tee /data/quant/verify_data_accuracy.txt
          volumeMounts:
            - name: msg-backup
              mountPath: /www/wwwroot/mdl/msg_backup
            - name: output
              mountPath: /data/quant
          env:
            - name: TZ
              value: Asia/Shanghai
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: output
              mountPath: /data/quant
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 1Gi
      volumes:
        - name: msg-backup
          hostPath:
            path: /www/wwwroot/mdl/msg_backup
            type: DirectoryOrCreate
        - name: output
          hostPath:
            path: /data/quant
            type: DirectoryOrCreate
