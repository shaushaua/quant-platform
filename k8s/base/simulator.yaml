# 模拟器 Job：从 OSS 下载历史数据写入 ShmStore，测试 StreamingEngine
# 用法：
#   1. 先把脚本拷到节点：scp scripts/simulate_collector.py root@node:/data/quant/scripts/
#   2. kubectl apply -f k8s/base/simulator.yaml
#   3. 等 Job 完成，查看因子输出
---
apiVersion: batch/v1
kind: Job
metadata:
  name: simulator
  namespace: quant
  labels:
    app: simulator
spec:
  # 写完后不自动删除 Job，方便查看日志
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simulator
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - python
            - /scripts/simulate_collector.py
            - --date
            - "20250103"
            - --speed
            - max
            - --max-rows
            - "50000"
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SHM_STORE_PATH
              value: /dev/shm/quant-store
            - name: OSS_DATA_BUCKET
              value: quant-mdl-data
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: shm-store
              mountPath: /dev/shm/quant-store
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: simulator-script
            defaultMode: 0755
        - name: shm-store
          hostPath:
            path: /dev/shm/quant-store
            type: DirectoryOrCreate
