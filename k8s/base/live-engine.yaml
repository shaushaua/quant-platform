# live-engine：流式因子计算引擎（常驻 Deployment）
# 增量消费 ShmStore chunk，维护 per-stock 聚合状态，每分钟计算因子
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-engine
  namespace: quant
  labels:
    app: live-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-engine
  template:
    metadata:
      labels:
        app: live-engine
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        role: live-trading
      tolerations:
        - key: role
          operator: Equal
          value: live-trading
          effect: NoSchedule
      containers:
        - name: live-engine
          image: 172.24.99.176:5000/quant-platform/backtest-base:latest
          command:
            - /bin/sh
            - -c
            - python -m quant_platform.live_engine.streaming_engine 2>&1 | tee /data/factors/startup.log
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SHM_STORE_PATH
              value: /dev/shm/quant-store
            - name: FACTOR_MODULE
              value: "quant_platform.factor.examples.live_vwap"
            - name: COMPUTE_INTERVAL
              value: "60"
            - name: UNIVERSE
              value: ""
            - name: FACTOR_OUTPUT_PATH
              value: /data/factors
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: shm-store
              mountPath: /dev/shm/quant-store
              readOnly: true
            - name: factor-output
              mountPath: /data/factors
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: shm-store
          hostPath:
            path: /dev/shm/quant-store
            type: DirectoryOrCreate
        - name: factor-output
          hostPath:
            path: /data/quant/factors
            type: DirectoryOrCreate
