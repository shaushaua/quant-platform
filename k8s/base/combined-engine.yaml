# combined-engine：合并 collector + live-engine 为单 Pod
# 直接连远程 MDL 云端，无需本机通联客户端，可多副本弹性伸缩
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combined-engine
  namespace: quant
  labels:
    app: combined-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: combined-engine
  template:
    metadata:
      labels:
        app: combined-engine
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        quant.lianghua.io/combined-engine: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: quant
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
      containers:
        - name: combined-engine
          image: 172.24.99.176:5000/quant-platform/combined-engine:latest
          env:
            # --- MDL feeder_client + native C++ collector ---
            - name: MDL_USE_LOCAL_CLIENT
              value: "true"
            # MDL_TOKEN 从 secret 注入，供 feeder_client.cfg 使用
            - name: MDL_IO_THREADS
              value: "4"
            - name: MDL_CALLBACK_MULTITHREAD
              value: "true"
            - name: MDL_SUBS
              value: "4.4,4.24,6.28,6.33,6.36"
            - name: MDL_FLUSH_INTERVAL_MS
              value: "10"
            - name: MDL_BATCH_SIZE
              value: "2000"
            - name: MDL_QUEUE_WARN_SIZE
              value: "50000"
            - name: MDL_QUEUE_HARD_LIMIT
              value: "200000"
            - name: MDL_LOCAL_SPLIT_SUBS
              value: "true"
            - name: MDL_TCP_OUTPUT_BUFFER_MAX
              value: "2048000"
            - name: MDL_TRACK_ORDER_DEAL_STATE
              value: "false"
            - name: MDL_LOG_PATH
              value: /data/quant/mdl_logs/mdl
            # --- 因子计算 ---
            - name: FACTOR_MODULE
              value: "quant_platform.strategies.protected_eillen_intraday_strategy"
            - name: DAILY_FACTOR_MODULE
              value: "quant_platform.strategies.protected_eillen_strategy"
            - name: INFERENCE_MODULE
              value: "quant_platform.inference.robot_model_inference"
            - name: ROBOT_TARGET_CAPITAL
              value: "50000000"
            - name: ROBOT_MAX_ORDERS
              value: "10"
            - name: ROBOT_POSITION_TAIL_FRAC
              value: "0.10"
            - name: ROBOT_LOT_SIZE
              value: "100"
            - name: ROBOT_DEFAULT_PRICE
              value: "10"
            - name: ROBOT_ENABLE_SELL
              value: "true"
            - name: ROBOT_STRATEGY_NAME
              value: "robot_model"
            - name: PORTFOLIO_CONTEXT_MODULE
              value: "quant_platform.broker.order_context"
            - name: COMPUTE_INTERVAL
              value: "60"
            - name: COMPUTE_SCHEDULES
              value: "minute,daily"
            - name: DAILY_FACTOR_TRIGGER_TIME
              value: "15:10"
            # --- Order gateway ---
            - name: ORDER_GATEWAY_URL
              value: "http://172.16.0.47:18080"
            - name: ORDER_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: ORDER_GATEWAY_TOKEN
            - name: ORDER_GATEWAY_TIMEOUT
              value: "10"
            - name: ORDER_POSITION_MAX_STALE_SECONDS
              value: "15"
            - name: BROKER_TYPE
              value: "atx"
            - name: BROKER_ACCOUNT_ID
              value: "00033770"
            - name: ORDER_DEFAULT_STRATEGY
              value: "quant_platform"
            - name: ORDER_DEFAULT_PRICE_TYPE
              value: "latest"
            - name: DATA_FLUSH_INTERVAL
              value: "0.01"
            - name: SHM_STORE_BACKEND
              value: "native"
            - name: UNIVERSE
              value: ""
            - name: FACTOR_OUTPUT_PATH
              value: /data/factors
            - name: DAILY_BASIC_MARKET_COUNT
              value: "5"
            # --- 指数成分股（MySQL idx_cons 表，填指数 SECURITY_ID）---
            # 1782=沪深300, 2103=中证500, 33736=中证1000, 3800=中证全指, 1200245=中证2000
            - name: IDX_CONS_IDS
              value: "1782,2103,33736,3800,1200245"
            # --- 交易员 trading_universe 接口（可选，配了则必须成功）---
            - name: TRADING_UNIVERSE_MODULE
              value: ""
            - name: FACTOR_WORKERS
              value: "40"
            # --- 原始行情归档：内存计算同时落盘，盘后上传 OSS ---
            - name: RAW_DATA_ARCHIVE_ENABLED
              value: "true"
            - name: ARCHIVE_INTERVAL
              value: "1800"
            - name: RAW_DATA_UPLOAD_TIME
              value: "15:10"
            - name: COLLECTOR_DISK_OUTPUT
              value: /data/collector_output
            # --- PML 录制（调试用，默认关闭，避免热路径复制 raw buffer）---
            - name: PML_RECORD_DIR
              value: ""
            - name: PML_RECORD_SECONDS
              value: "0"
            # --- 通用 ---
            - name: ENGINE_MODE
              value: "native"
            - name: TZ
              value: Asia/Shanghai
            - name: LOG_LEVEL
              value: INFO
            - name: PYTHONWARNINGS
              value: ignore::DeprecationWarning
            - name: PIPELINE_LOG_DIR
              value: /data/quant/pipeline_logs
            - name: PIPELINE_LOG_FALLBACK_DIR
              value: /tmp/quant_pipeline_logs
            # --- Native C++ collector (ENGINE_MODE=native 时生效) ---
            - name: NATIVE_SHM_DIR
              value: /data/quant/shm
            - name: NATIVE_ROWS_PER_STOCK
              value: "200000"
            - name: NATIVE_TICK_ROWS_PER_STOCK
              value: "50000"
            - name: NATIVE_ORDER_ROWS_PER_STOCK
              value: "3000000"
            - name: NATIVE_DEAL_ROWS_PER_STOCK
              value: "3000000"
            - name: NATIVE_MDL_IO_THREADS
              value: "4"
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: factor-output
              mountPath: /data/factors
            - name: pipeline-logs
              mountPath: /data/quant/pipeline_logs
            - name: mdl-logs
              mountPath: /data/quant/mdl_logs
            - name: raw-archive
              mountPath: /data/collector_output
            - name: shm-buffers
              mountPath: /data/quant/shm
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "32"
              memory: 90Gi
              # Override in overlays: k8s/overlays/dev or k8s/overlays/prod
      volumes:
        - name: factor-output
          hostPath:
            path: /data/quant/factors
            type: DirectoryOrCreate
        - name: pipeline-logs
          hostPath:
            path: /data/quant/pipeline_logs
            type: DirectoryOrCreate
        - name: mdl-logs
          hostPath:
            path: /data/quant/mdl_logs
            type: DirectoryOrCreate
        - name: raw-archive
          hostPath:
            path: /data/quant/collector_output
            type: DirectoryOrCreate
        - name: shm-buffers
          hostPath:
            path: /data/quant/shm
            type: DirectoryOrCreate
