# combined-engine：合并 collector + live-engine 为单 Pod
# 直接连远程 MDL 云端，无需本机通联客户端，可多副本弹性伸缩
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combined-engine
  namespace: quant
  labels:
    app: combined-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: combined-engine
  template:
    metadata:
      labels:
        app: combined-engine
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        quant.lianghua.io/combined-engine: "true"
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: combined-engine
          image: 172.24.99.176:5000/quant-platform/combined-engine:latest
          command: ["python", "-m", "quant_platform.live_engine.combined_engine"]
          env:
            # --- pymdl SDK (remote) ---
            - name: MDL_SERVER
              value: "mdl-cloud-sh.datayes.com:19012"
            - name: MDL_SERVER_SH
              value: "appa-mdl-sse-private.datayes.com:19010"
            # MDL_TOKEN 从 secret 注入
            - name: MDL_IO_THREADS
              value: "4"
            - name: MDL_CALLBACK_MULTITHREAD
              value: "false"
            - name: MDL_ENCODING
              value: "7"
            - name: MDL_ENABLE_MERGE
              value: "true"
            - name: MDL_SUBS
              value: "4.4,4.24,6.28,6.33,6.36"
            - name: MDL_FLUSH_INTERVAL_MS
              value: "10"
            - name: MDL_BATCH_SIZE
              value: "2000"
            - name: MDL_QUEUE_WARN_SIZE
              value: "50000"
            - name: MDL_QUEUE_HARD_LIMIT
              value: "200000"
            - name: MDL_LOG_PATH
              value: /data/quant/mdl_logs/mdl
            # --- 因子计算 ---
            - name: FACTOR_MODULE
              value: "quant_platform.factor.examples.live_momentum"
            - name: COMPUTE_INTERVAL
              value: "60"
            - name: DATA_FLUSH_INTERVAL
              value: "0.01"
            - name: UNIVERSE
              value: ""
            - name: FACTOR_OUTPUT_PATH
              value: /data/factors
            - name: DAILY_BASIC_MARKET_COUNT
              value: "5"
            # --- 原始行情归档：内存计算同时落盘，16:00 后上传 OSS ---
            - name: RAW_DATA_ARCHIVE_ENABLED
              value: "true"
            - name: RAW_DATA_UPLOAD_TIME
              value: "15:40"
            - name: COLLECTOR_DISK_OUTPUT
              value: /data/collector_output
            - name: COLLECTOR_MAX_DISK_QUEUE
              value: "200"
            # --- 通用 ---
            - name: TZ
              value: Asia/Shanghai
            - name: LOG_LEVEL
              value: INFO
            - name: PIPELINE_LOG_DIR
              value: /data/quant/pipeline_logs
            - name: PIPELINE_LOG_FALLBACK_DIR
              value: /tmp/quant_pipeline_logs
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: factor-output
              mountPath: /data/factors
            - name: pipeline-logs
              mountPath: /data/quant/pipeline_logs
            - name: mdl-logs
              mountPath: /data/quant/mdl_logs
            - name: raw-archive
              mountPath: /data/collector_output
          resources:
            requests:
              cpu: "4"
              memory: 64Gi
            limits:
              cpu: "12"
              memory: 90Gi
      volumes:
        - name: factor-output
          hostPath:
            path: /data/quant/factors
            type: DirectoryOrCreate
        - name: pipeline-logs
          hostPath:
            path: /data/quant/pipeline_logs
            type: DirectoryOrCreate
        - name: mdl-logs
          hostPath:
            path: /data/quant/mdl_logs
            type: DirectoryOrCreate
        - name: raw-archive
          hostPath:
            path: /data/quant/collector_output
            type: DirectoryOrCreate
