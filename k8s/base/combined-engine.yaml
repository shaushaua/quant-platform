# combined-engine：合并 collector + live-engine 为单 Pod
# 直接连远程 MDL 云端，无需本机通联客户端，可多副本弹性伸缩
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combined-engine
  namespace: quant
  labels:
    app: combined-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: combined-engine
  template:
    metadata:
      labels:
        app: combined-engine
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        quant.lianghua.io/combined-engine: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: quant
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
      containers:
        - name: combined-engine
          image: 172.24.99.176:5000/quant-platform/combined-engine:latest
          env:
            # --- MDL feeder_client + native C++ collector ---
            - name: MDL_USE_LOCAL_CLIENT
              value: "true"
            # MDL_TOKEN 从 secret 注入，供 feeder_client.cfg 使用
            - name: MDL_IO_THREADS
              value: "4"
            - name: MDL_CALLBACK_MULTITHREAD
              value: "true"
            - name: MDL_SUBS
              value: "4.4,4.24,6.28,6.33,6.36"
            - name: MDL_FLUSH_INTERVAL_MS
              value: "10"
            - name: MDL_BATCH_SIZE
              value: "2000"
            - name: MDL_QUEUE_WARN_SIZE
              value: "50000"
            - name: MDL_QUEUE_HARD_LIMIT
              value: "200000"
            - name: MDL_LOCAL_SPLIT_SUBS
              value: "true"
            - name: MDL_TCP_OUTPUT_BUFFER_MAX
              value: "2048000"
            - name: MDL_TRACK_ORDER_DEAL_STATE
              value: "false"
            - name: MDL_LOG_PATH
              value: /data/quant/mdl_logs/mdl
            # --- 因子计算 ---
            - name: FACTOR_MODULE
              value: "quant_platform.strategies.protected_eillen_intraday_strategy"
            - name: DAILY_FACTOR_MODULE
              value: "quant_platform.strategies.protected_eillen_strategy_v2"
            # V2 策略只暴露多票 batch 入口，daily 也要走多票协议
            # (native_engine.py:324 由本开关选择 multi-code 路径)
            - name: DAILY_USE_MULTI_CODE
              value: "true"
            # daily 因子列名兼容历史回测：backtest worker 用 END_TIMES=150000
            # 产出 F_<hash>_150000；live 也显式传同一 end_time，避免产出 F_<hash>。
            - name: END_TIMES
              value: "150000"
            - name: INFERENCE_MODULE
              value: "quant_platform.inference.tree_model_orders"
            # 恢复树模型原始换手约束；大额入金建仓阶段曾临时放宽为 1.0。
            - name: OPTIMIZER_MAX_TURNOVER
              value: "0.35"
            # --- 实盘资金：通过 order-gateway /v1/balance 接口取真实总资产 ---
            # portfolio_context_fn 调 _fetch_balance(ORDER_GATEWAY_URL, BROKER_ACCOUNT_ID)
            # → positions_to_orders 用 account.total_asset 做 position sizing。
            # 首日无持仓时按目标仓位买入；后续调仓仍按目标仓位生成完整买单。
            # gateway 会把同批卖单排在买单前，并用本批卖出估值的 90% 做买入预算。
            # 模拟盘才打开下面两行（强制 1000 万虚拟资金），实盘必须注释掉。
            # - name: OPEN_POSITION_SIM_MODE
            #   value: "1"
            # - name: OPEN_POSITION_TOTAL_CAPITAL
            #   value: "10000000"
            # --- 09:30 用开盘行情过滤涨停票、计算目标并下单 ---
            # --- 一次性清仓：模拟盘启动时把 broker 持仓全平 ---
            # 启用后 pod 起来 spawn daemon thread,等到 09:15 拉持仓并全推 sell。
            # 幂等：/data/factors/{trading_day}_close_done.flag 写后不再重试。
            # 用完务必改回 "0"，否则每个交易日 09:15 都会清仓。
            - name: ONE_TIME_CLOSE_ON_STARTUP
              value: "0"
            - name: ONE_TIME_CLOSE_TRIGGER_TIME
              value: "09:15"
            - name: TREE_MODEL_STRATEGY_NAME
              value: "tree_model"
            # tree_model_inference 的 OSS 缓存目录（model + daily_basic parquet）
            # 复用 factor-output 挂载点，避免容器 cwd 不可写
            - name: TREE_MODEL_OSS_CACHE_DIR
              value: "/data/factors/oss_cache/tree_model"
            - name: PORTFOLIO_CONTEXT_MODULE
              value: "quant_platform.broker.order_context"
            - name: COMPUTE_INTERVAL
              value: "60"
            # 9:30 只运行开盘日频调仓，避免与分钟因子争抢 CPU。
            - name: MINUTE_SKIP_TIMES
              value: "09:30"
            - name: COMPUTE_SCHEDULES
              value: "minute,daily,daily_position,open_position,daily_basic_refresh"
            # 临时关闭分钟级下单：minute 继续算因子+同步 tick，但不推单
            # 想恢复分钟下单把这个改成 true 即可
            - name: MINUTE_RUN_INFERENCE
              value: "false"
            - name: DAILY_FACTOR_TRIGGER_TIME
              value: "15:10"
            - name: DAILY_POSITION_TRIGGER_TIME
              value: "14:50"
            # --- 9:30 开盘计算目标并下单 ---
            - name: OPEN_POSITION_TRIGGER_TIME
              value: "09:30"
            # 09:35 起禁止补触发，避免 Pod 盘中重启后重复调仓。
            - name: OPEN_POSITION_TRIGGER_DEADLINE
              value: "09:35"
            # --- Order gateway ---
            - name: ORDER_GATEWAY_URL
              value: "http://172.16.0.47:18080"
            - name: ORDER_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: ORDER_GATEWAY_TOKEN
            - name: ORDER_GATEWAY_TIMEOUT
              value: "10"
            - name: ORDER_POSITION_MAX_STALE_SECONDS
              value: "15"
            - name: BROKER_TYPE
              value: "atx"
            - name: BROKER_ACCOUNT_ID
              value: "00033770"
            - name: ORDER_DEFAULT_STRATEGY
              value: "quant_platform"
            # 执行算法由引擎下单策略决定；gateway 只负责转换为 ATX 协议。
            - name: DATA_FLUSH_INTERVAL
              value: "0.01"
            - name: SHM_STORE_BACKEND
              value: "native"
            - name: UNIVERSE
              value: ""
            - name: FACTOR_OUTPUT_PATH
              value: /data/factors
            # DAILY_BASIC_MARKET_COUNT 已不需要 —— 引擎自动从策略 FACTOR_INFO.market_count 读取
            # (native_engine._load_daily_basic 扫描 FACTOR_MODULE + DAILY_FACTOR_MODULE 取 max)
            # 仅在策略读不到时作为兜底，平时建议不设。
            # - name: DAILY_BASIC_MARKET_COUNT
            #   value: "60"
            # --- 指数成分股(优先 OSS composition.parquet,fallback MySQL idx_cons)---
            # TICKER 代码格式;若 mkt_idxd_csi 中出现重复 TICKER 可改用 TICKER.EXCHANGE 消歧
            # 未配置时自动兼容旧的 IDX_CONS_IDS(SECURITY_ID)
            # 000300=沪深300, 000905=中证500, 000852=中证1000, 000985=中证全指, 932000=中证2000
            - name: IDX_CONS_CODES
              value: "000300,000905,000852,000985,932000"
            # --- 通联 DataYes API: 拉 Barra SW21 因子 (T+1 凌晨 2 点更新) ---
            # Pod 启动时主动调 API 覆盖 MySQL 滞后的 barra 数据,生成 daily_basic parquet
            - name: DATAYES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quant-secrets
                  key: DATAYES_TOKEN
            # --- 交易员 trading_universe 接口（可选，配了则必须成功）---
            - name: TRADING_UNIVERSE_MODULE
              value: ""
            - name: FACTOR_WORKERS
              value: "40"
            # --- 原始行情归档：内存计算同时落盘，盘后上传 OSS ---
            - name: RAW_DATA_ARCHIVE_ENABLED
              value: "true"
            - name: ARCHIVE_INTERVAL
              value: "1800"
            - name: RAW_DATA_UPLOAD_TIME
              value: "15:30"
            - name: COLLECTOR_DISK_OUTPUT
              value: /data/collector_output
            # 盘后归档按 order -> deal -> tick 顺序串行冻结/上传；tick 不并行抢内存。
            - name: RAW_ARCHIVE_POST_CLOSE_SNAPSHOT_KINDS
              value: "order,deal,tick"
            - name: RAW_ARCHIVE_POST_CLOSE_UPLOAD_KINDS
              value: "order,deal,tick"
            # SHM 原始数据（mmap 二进制）打包上传到 OSS，用于调试重放。
            # OSS 路径：{year}/{ym}/{date}/{date}_shm.tar.zst
            - name: RAW_ARCHIVE_POST_CLOSE_UPLOAD_SHM
              value: "true"
            - name: RAW_ARCHIVE_EXIT_SNAPSHOT_KINDS
              value: "order,deal,tick"
            - name: RAW_ARCHIVE_EXIT_UPLOAD_SHM
              value: "true"
            # 控制归档峰值内存：snapshot 小批落盘，DuckDB merge 允许 spill。
            - name: ARCHIVE_SNAPSHOT_MAX_ROWS_PER_CHUNK
              value: "100000"
            - name: ARCHIVE_SNAPSHOT_CHUNK_PAUSE_SEC
              value: "0.2"
            - name: ARCHIVE_DUCKDB_MEMORY
              value: "8GB"
            - name: ARCHIVE_DUCKDB_THREADS
              value: "4"
            - name: ARCHIVE_DUCKDB_MAX_TEMP
              value: "200GB"
            - name: ARCHIVE_DUPLICATE_STATS_ENABLED
              value: "false"
            - name: ARCHIVE_VALIDATE_TIMES_ENABLED
              value: "true"
            # --- PML 录制（调试用，默认关闭，避免热路径复制 raw buffer）---
            - name: PML_RECORD_DIR
              value: ""
            - name: PML_RECORD_SECONDS
              value: "0"
            # --- 通用 ---
            - name: ENGINE_MODE
              value: "native"
            - name: TZ
              value: Asia/Shanghai
            - name: LOG_LEVEL
              value: INFO
            - name: PYTHONWARNINGS
              value: ignore::DeprecationWarning
            - name: PIPELINE_LOG_DIR
              value: /data/quant/pipeline_logs
            - name: PIPELINE_LOG_FALLBACK_DIR
              value: /tmp/quant_pipeline_logs
            # --- Native C++ collector (ENGINE_MODE=native 时生效) ---
            - name: NATIVE_SHM_DIR
              value: /data/quant/shm
            - name: NATIVE_ROWS_PER_STOCK
              value: "200000"
            - name: NATIVE_TICK_ROWS_PER_STOCK
              value: "50000"
            - name: NATIVE_ORDER_ROWS_PER_STOCK
              value: "3000000"
            - name: NATIVE_DEAL_ROWS_PER_STOCK
              value: "3000000"
            - name: NATIVE_MDL_IO_THREADS
              value: "4"
          envFrom:
            - secretRef:
                name: quant-secrets
          volumeMounts:
            - name: factor-output
              mountPath: /data/factors
            - name: pipeline-logs
              mountPath: /data/quant/pipeline_logs
            - name: mdl-logs
              mountPath: /data/quant/mdl_logs
            - name: raw-archive
              mountPath: /data/collector_output
            - name: shm-buffers
              mountPath: /data/quant/shm
            - name: mdl-backup
              mountPath: /data/quant/mdl_msg_backup
          resources:
            requests:
              cpu: "20"
              memory: 48Gi
            limits:
              cpu: "32"
              memory: 88Gi
              # Override in overlays: k8s/overlays/dev or k8s/overlays/prod
      volumes:
        - name: factor-output
          hostPath:
            path: /data/quant/factors
            type: DirectoryOrCreate
        - name: pipeline-logs
          hostPath:
            path: /data/quant/pipeline_logs
            type: DirectoryOrCreate
        - name: mdl-logs
          hostPath:
            path: /data/quant/mdl_logs
            type: DirectoryOrCreate
        - name: raw-archive
          hostPath:
            path: /data/quant/collector_output
            type: DirectoryOrCreate
        - name: shm-buffers
          hostPath:
            path: /data/quant/shm
            type: DirectoryOrCreate
        - name: mdl-backup
          hostPath:
            path: /data/quant/mdl_msg_backup
            type: DirectoryOrCreate
