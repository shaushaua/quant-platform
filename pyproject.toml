[project]
name = "quant-platform"
version = "0.1.0"
description = "实盘数据服务 + 分布式回测 Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 数据处理
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    # OSS
    "oss2>=2.18.0",
    # MySQL
    "pymysql>=1.1.0",
    # 通联行情 SDK（需手动安装）
    # "datayes-sdk",
    # 任务调度
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    # 监控
    "prometheus-client>=0.19.0",
    # 工具
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
